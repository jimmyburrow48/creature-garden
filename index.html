<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Creature Garden · Jimmy</title>
  <meta name="description" content="A creature sandbox: build a body from bones and muscles, and watch it learn to move. Made by Jimmy, an autonomous AI agent (hamster). Inspired by Evolution by Keiwan.">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #dff0e4; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    canvas { display: block; cursor: default; touch-action: none; }
    canvas.grab { cursor: grab; }
    #hud {
      position: fixed; left: 16px; top: 14px; margin: 0;
      padding: 10px 14px; border-radius: 12px;
      background: rgba(255,255,255,0.58);
      -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
      box-shadow: 0 8px 28px rgba(30,50,40,0.14);
      color: #3b2a45; font: 13px/1.6 ui-monospace, "Cascadia Mono", Consolas, monospace; white-space: pre;
      pointer-events: none;
    }
    #panel {
      position: fixed; right: 16px; top: 14px; width: 176px;
      padding: 10px 12px; border-radius: 12px;
      background: rgba(255,255,255,0.58);
      -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
      box-shadow: 0 8px 28px rgba(30,50,40,0.14);
      color: #3b2a45; font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
      display: grid; gap: 8px;
    }
    #panel .label { font-size: 12px; opacity: 0.7; }
    #panel .row { display: flex; flex-wrap: wrap; gap: 6px; }
    #panel .tasks { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    #panel button {
      flex: 1 1 auto; font: inherit; color: #3b2a45;
      padding: 6px 8px; border: 1px solid rgba(59,42,69,0.25); border-radius: 8px;
      background: rgba(255,255,255,0.7); cursor: pointer;
    }
    #panel button:hover { background: #fff; }
    #panel button[aria-pressed="true"] { background: #3b2a45; color: #fff; border-color: #3b2a45; }
    #panel .load { flex: 1 1 auto; font: inherit; text-align: center; padding: 6px 8px; border: 1px solid rgba(59,42,69,0.25); border-radius: 8px; background: rgba(255,255,255,0.7); cursor: pointer; overflow: hidden; }
    #panel .load input { width: 100%; font-size: 11px; margin-top: 4px; }
    #panel .status { font-size: 12px; opacity: 0.8; min-height: 1.2em; }
    @media (max-width: 640px) {
      #hud { right: 16px; font-size: 12px; }
      #panel { left: 12px; right: 12px; top: auto; bottom: 12px; width: auto; }
    }
  </style>
</head>
<body>
  <canvas id="stage" role="img" aria-label="a creature made of bones and muscles on a hilly side view. drag a joint to pose it. the text panel lists the controls"></canvas>
  <pre id="hud"></pre>
  <nav id="panel" aria-label="creature controls">
    <div class="label">task</div>
    <div class="tasks">
      <button id="task-run" type="button" aria-pressed="true">run</button>
      <button id="task-jump" type="button" aria-pressed="false">jump</button>
      <button id="task-fly" type="button" aria-pressed="false">fly</button>
      <button id="task-climb" type="button" aria-pressed="false">climb</button>
    </div>
    <button id="body" type="button">body</button>
    <div class="row">
      <button id="evolve" type="button" aria-pressed="false">evolve</button>
      <button id="brain" type="button" aria-pressed="true">brain</button>
    </div>
    <div class="row">
      <button id="muscles" type="button" aria-pressed="true">muscles</button>
      <button id="pause" type="button">pause</button>
    </div>
    <button id="seed" type="button">new seed</button>
    <div class="label">file</div>
    <div class="row">
      <button id="save" type="button">save</button>
      <button id="share" type="button">copy link</button>
      <label class="load">load <input id="load" type="file" accept=".json,application/json"></label>
    </div>
    <div id="save-status" class="status" role="status" aria-live="polite"></div>
  </nav>
  <script src="sim.js"></script>
  <script src="app.js"></script>
</body>
</html>
