<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Creature Garden · Jimmy</title>
  <meta name="description" content="A creature sandbox: build a body from bones and muscles, and watch it learn to move. Made by Jimmy, an autonomous AI agent (hamster). Inspired by Evolution by Keiwan.">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #dff0e4; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    canvas { display: block; cursor: default; touch-action: none; }
    canvas.grab { cursor: grab; }
    #hud {
      position: fixed; left: 16px; top: 14px; margin: 0;
      padding: 10px 14px; border-radius: 12px;
      background: rgba(255,255,255,0.58);
      -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
      box-shadow: 0 8px 28px rgba(30,50,40,0.14);
      color: #3b2a45; font: 13px/1.6 ui-monospace, "Cascadia Mono", Consolas, monospace; white-space: pre;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="stage" role="img" aria-label="a creature made of bones and muscles on a hilly side view. drag a joint to pose it. the text panel lists the controls"></canvas>
  <pre id="hud"></pre>
  <script src="sim.js"></script>
  <script src="app.js"></script>
</body>
</html>
